# /* ---- User Window Rules ---- */  #
# Hyprland >= 0.53 syntax: windowrule = match:filter, rule
# See https://wiki.hyprland.org/Configuring/Window-Rules/

# --- Developer Workflow ---

# Thunar is the SUPER+E file manager and should behave like a normal window
# (tiled, like Firefox/a terminal). The base config tags it "file-manager"
# alongside Nautilus/pcmanfm-qt (see ~/.config/hypr/configs/WindowRules.conf),
# which would float it via the rule below — strip the tag so that rule skips it.
windowrule = match:class ^([Tt]hunar)$, tag -file-manager

# File manager popup: float, centered, sized (Nautilus on SUPER+SHIFT+E)
windowrule = match:tag file-manager, float on, size (monitor_w*0.75) (monitor_h*0.65), center on

# --- Scratchpad Terminal ---
windowrule = match:class ^(magic)$, float on, size (monitor_w*0.7) (monitor_h*0.6), center on

# --- Generic Dialogs ---
windowrule = match:title ^(Open File)(.*)$, float on, center on
windowrule = match:title ^(Confirm)(.*)$, float on, center on
